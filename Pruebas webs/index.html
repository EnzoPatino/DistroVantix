<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manual de Kali Linux</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Carpeta Cerrada (Pantalla Inicial) -->
    <div id="closed-folder" class="folder-exterior">
      <div class="folder-front">
        <h1>MANUAL TÉCNICO</h1>
        <p>Kali Linux & Seguridad</p>
        <button class="open-btn" onclick="openBook()">ABRIR</button>
      </div>
    </div>

    <!-- Contenido del Libro Abierto (Oculto al inicio) -->
    <div id="main-content" class="book-wrapper" style="display: none">
      <!-- Botón de Cerrar (NUEVO) -->
      <button class="close-book-btn" onclick="closeBook()">CERRAR ✖</button>

      <!-- Flechas de navegación -->
      <button class="nav-btn prev" onclick="movePage(-1)">
        <svg viewBox="0 0 24 24">
          <path
            d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
          ></path>
        </svg>
      </button>

      <div class="book-container" id="book">
        <!-- PORTADA INTERNA -->
        <div class="spread active">
          <div class="page cover">
            <h1>Comandos de KALI LINUX</h1>
            <p>Documentación técnica fija.</p>
          </div>
        </div>

        <!-- BLOQUE DE PÁGINAS 1 y 2 -->
        <div class="spread">
          <div class="page left-page">
            <h2>Primera Hoja</h2>
            <p>Contenido fijo aquí...</p>
          </div>
          <div class="page right-page">
            <h2>Segunda Hoja</h2>
            <p>Más información aquí...</p>
          </div>
        </div>
      </div>

      <button class="nav-btn next" onclick="movePage(1)">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"
          ></path>
        </svg>
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
